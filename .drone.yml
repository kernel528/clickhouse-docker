kind: pipeline
type: docker
name: 26-clickhouse-amd64

trigger:
  branch:
    - '26'
  event:
    - pull_request

# Build the docker image for amd64 architecture
steps:
  - name: amd64-image-build
    image: plugins/docker
    environment:
      DOCKER_BUILDKIT: 1
      DOCKER_REPO:
        from_secret: docker_repo
    settings:
      platforms:
        - linux/amd64
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password
      repo: kernel528/clickhouse
      tags:
        - 'pr-${DRONE_PULL_REQUEST}-build-${DRONE_BUILD_NUMBER}-amd64'
      dry_run: true

  # Slack notification
  - name: slack-notification
    image: plugins/slack
    when:
      status:
        - failure
        - success
    settings:
      webhook:
        from_secret: slack_webhook_drone_alerts
---

kind: pipeline
type: docker
name: main-clickhouse-amd64

trigger:
  event:
    - tag

# Build the docker image for the main branch & tagged release
steps:
  - name: main-docker-image-build
    image: plugins/docker
    environment:
      DOCKER_REPO:
        from_secret: docker_repo
    when:
      event:
        - tag
    settings:
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password
      repo: kernel528/clickhouse
      tags:
        - ${DRONE_TAG}

  # Slack notification
  - name: slack-notification
    image: plugins/slack
    when:
      status:
        - failure
        - success
    settings:
      webhook:
        from_secret: slack_webhook_drone_alerts
